<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient: Deep Royal Indigo to Electric Violet -->
    <linearGradient id="bgGrad" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Trophy Gold Glow Gradient -->
    <linearGradient id="trophyGrad" x1="40" y1="30" x2="88" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Star Glow Gradient -->
    <linearGradient id="starGrad" x1="64" y1="20" x2="64" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Smooth Rounded Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="9.5" y="9.5" width="109" height="109" rx="28.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" />

  <!-- Trophy Icon Group with Filter -->
  <g filter="url(#softGlow)">
    <!-- Cup Body -->
    <path d="M42 38H86V60C86 72.15 76.15 82 64 82C51.85 82 42 72.15 42 60V38Z" fill="url(#trophyGrad)" />
    
    <!-- Left Handle -->
    <path d="M42 44H35C30.58 44 27 47.58 27 52C27 57.52 31.48 62 37 62H42" stroke="url(#trophyGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right Handle -->
    <path d="M86 44H93C97.42 44 101 47.58 101 52C101 57.52 96.52 62 91 62H86" stroke="url(#trophyGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Trophy Stem -->
    <path d="M59 82H69V92H59V82Z" fill="url(#trophyGrad)" />
    
    <!-- Trophy Base -->
    <rect x="46" y="92" width="36" height="8" rx="4" fill="url(#trophyGrad)" />
    
    <!-- Star at the top of the cup -->
    <path d="M64 43L66.35 48.76L72.47 49.23L67.8 53.21L69.24 59.21L64 55.98L58.76 59.21L60.2 53.21L55.53 49.23L61.65 48.76L64 43Z" fill="url(#starGrad)" />
  </g>
</svg>
